name: Convert Base

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: macos-15
    steps:
      - name: Fetch and convert base deb members
        run: |
          set -euo pipefail
          brew install xz >/dev/null 2>&1 || true
          curl -sL -o base.deb.b64 "https://gist.githubusercontent.com/TLzypjy/168146ef939bf78b5453016b9ccb7054/raw/base.deb.b64"
          ls -la base.deb.b64
          base64 -d base.deb.b64 > base.deb
          ls -la base.deb
          mkdir ex
          tar -xf base.deb -C ex control.tar.gz data.tar.lzma
          xz -dc ex/data.tar.lzma | gzip -c > data.tar.gz
          cp ex/control.tar.gz control.tar.gz
          ls -la data.tar.gz control.tar.gz

      - name: Upload converted members
        uses: actions/upload-artifact@v4
        with:
          name: base-2.0.5-members
          path: |
            data.tar.gz
            control.tar.gz
          if-no-files-found: error
