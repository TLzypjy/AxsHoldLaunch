name: Build ARC 长按全屏启动

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos-roothide

jobs:
  build:
    name: Build (${{ matrix.build_variant }})
    runs-on: macos-15
    outputs:
      package_version: ${{ steps.bump.outputs.package_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - build_variant: rootful
          - build_variant: rootless
          - build_variant: roothide

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> "$HOME/.theosrc"

      - name: Bump Package Version
        id: bump
        run: |
          VERSION="5.2.0-${{ github.run_number }}"
          echo "Using version: $VERSION"
          sed -i '' "s/^Version: .*/Version: ${VERSION}/" control
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout Theos (RootHide)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install Theos dependencies
        run: |
          brew install ldid dpkg xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Build Package
        run: |
          sh build.sh "${{ matrix.build_variant }}"
          echo "=== .deb files ==="
          find ./packages -name "*.deb" -type f

      - name: Verify Package
        run: |
          set -euo pipefail
          for deb in ./packages/*.deb; do
            echo "=== dpkg-deb -I $(basename "$deb") ==="
            dpkg-deb -I "$deb"
            echo "=== dpkg-deb -c $(basename "$deb") ==="
            dpkg-deb -c "$deb"
            echo "=== dylib strings check ==="
            DEB_DIR="$(mktemp -d)"
            dpkg-deb -x "$deb" "$DEB_DIR"
            DYLIB=$(find "$DEB_DIR" -name "AxsHoldLaunch.dylib" | head -n 1)
            test -n "$DYLIB"
            strings -a "$DYLIB" | grep -E "sc_handleSelectedBundleIdentifier|sc_openTargetIdentifier|HoldPressEnabled|axs.holdlaunch" | sort -u
            PLIST=$(find "$DEB_DIR" -name "AxsHoldLaunch.plist" | head -n 1)
            test -n "$PLIST"
            echo "--- filter plist ---"
            plutil -p "$PLIST" || cat "$PLIST"
            if ! plutil -p "$PLIST" 2>/dev/null | grep -q "com.apple.springboard"; then
              echo "ERROR: springboard missing from filter" && exit 1
            fi
            if ! plutil -p "$PLIST" 2>/dev/null | grep -q "com.apple.Preferences"; then
              echo "ERROR: preferences missing from filter" && exit 1
            fi
            rm -rf "$DEB_DIR"
            echo "verify ok"
          done

      - name: Collect Repack Files
        run: |
          set -euo pipefail
          mkdir -p ./repack
          DEB=$(find ./packages -name "*arm64e*.deb" | head -n 1)
          if [ -z "$DEB" ]; then DEB=$(find ./packages -name "*.deb" | head -n 1); fi
          EXTRACT="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$EXTRACT"
          find "$EXTRACT" -name "AxsHoldLaunch.dylib" -exec cp {} ./repack/ \;
          find "$EXTRACT" -name "AxsHoldLaunch.plist" -exec cp {} ./repack/ \;
          ls -la ./repack

      - name: Package 2.0.5+beautify.1 (dpkg-deb)
        if: matrix.build_variant == 'rootless'
        env:
          AXS_DYLIB: ${{ github.workspace }}/repack/AxsHoldLaunch.dylib
        run: |
          set -euo pipefail
          sh packaging/package_beautify.sh

      - name: Upload Beautify Package
        if: matrix.build_variant == 'rootless'
        uses: actions/upload-artifact@v4
        with:
          name: beautify-package
          path: packaging/out/*.deb
          if-no-files-found: error

      - name: Upload Repack Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repack-files-${{ matrix.build_variant }}
          path: ./repack/*
          if-no-files-found: error

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.build_variant }}
          path: ./packages/*.deb
          if-no-files-found: error

      - name: Create Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.bump.outputs.package_version }}
          name: ARC 长按全屏启动 v${{ steps.bump.outputs.package_version }}
          files: ./packages/*.deb
